spring.application.name=Canva-BNA

# ===========================
# Database Configuration
# ===========================
# MySQL (default)
spring.datasource.url=jdbc:mysql://localhost:3306/canva_bna?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# PostgreSQL (uncomment to switch)
# spring.datasource.url=jdbc:postgresql://localhost:5432/canva_bna
# spring.datasource.username=postgres
# spring.datasource.password=
# spring.datasource.driver-class-name=org.postgresql.Driver

# ===========================
# JPA / Hibernate
# ===========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Dialect auto-detected from driver — explicit override kept for clarity
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===========================
# JWT Configuration
# ===========================
# 512-bit Base64-encoded secret key (replace with your own in production)
app.jwt.secret=7A25432A462D4A614E645267556B58703272357538782F413F442847285B6B6170645367566B59703373367638792F423F4528482B4D6251655468576D5A713474
app.jwt.expiration-ms=86400000

# ===========================
# Server Configuration
# ===========================
server.port=8089
server.error.include-message=always

# ===========================
# JPA - Disable Open In View
# ===========================
spring.jpa.open-in-view=false
server.error.include-binding-errors=always

# ===========================
# Logging
# ===========================
logging.level.tn.esprit.canvabna=DEBUG
logging.level.org.springframework.security=INFO
logging.level.io.jsonwebtoken=DEBUG
