<div class="auth-wrapper">
  
  <!-- Squares Decor -->
  <div class="square-top-right-blue"></div>
  <div class="square-bottom-left-blue"></div>
  <div class="square-top-right-green"></div>
  <div class="square-bottom-left-green"></div>

  <div class="auth-content">
    
    <!-- Logo Section -->
    <div class="logo">
      
      <div class="logo-container">
        <!-- Assuming logo-name was meant for an image or text, using text based on previous iteration -->
        <img class="logo-name" src="Logo-bna-V213430-696x377.png" alt="BNA Bank Logo" style="max-width: 450px; margin: 20px auto 0 auto;">
        <div class="project-name">Banque Nationale Agricole CANVA</div>
      </div>
    </div>

    <!-- Form Section -->
    <div class="form-container">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-title">S'identifier</div>
        
        <div class="error-message" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>

        <div class="input-group">
          <label for="identifiant">Identifiant</label>
          <input type="text" id="identifiant" formControlName="matricule" [ngClass]="{'invalid': loginForm.get('matricule')?.invalid && loginForm.get('matricule')?.touched}" />
          <span class="icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </span>
        </div>
        
        <div class="input-group">
          <label for="password">Mot de passe</label>
          <input [type]="showPassword ? 'text' : 'password'" id="password" formControlName="password" [ngClass]="{'invalid': loginForm.get('password')?.invalid && loginForm.get('password')?.touched}" />
          <span class="icon" (click)="togglePasswordVisibility()">
            <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
            <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </span>
        </div>
        
        <button type="submit" class="login-btn" [disabled]="loginForm.invalid || isLoading">
          <span *ngIf="!isLoading">Se connecter</span>
          <span *ngIf="isLoading">Chargement...</span>
        </button>
      </form>
    </div>

  </div>
</div>
