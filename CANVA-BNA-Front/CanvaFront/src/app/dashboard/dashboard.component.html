<div class="dashboard-wrapper">
  <!-- Top Navbar -->
  <header class="navbar">
    <div class="navbar-left">
      <img src="Logo-bna-V213430-696x377.png" alt="Logo" class="nav-logo">
      <div class="nav-titles">
        <span class="nav-main-title">Canevas</span>
        <span class="nav-date">{{ todayDate }}</span>
      </div>
    </div>
    <div class="navbar-right">
      <button class="logout-btn" (click)="logout()">Déconnexion</button>
    </div>
  </header>

  <!-- Main Container (Sidebar + Content) -->
  <div class="main-container">
    
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="user-profile">
        <div class="avatar">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"></circle><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path></svg>
        </div>
        <div class="user-info">
          <div class="user-text">Matricule : <span class="highlight">{{ user?.matricule }}</span></div>
          <div class="user-text">Structure : <span class="highlight">{{ user?.position || user?.structure || '-' }}</span></div>
        </div>
      </div>

      <div class="nav-section">
        <div class="section-title">Modules</div>
        <nav class="nav-menu">
          <a routerLink="/dashboard/users" routerLinkActive="active" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
            Gestion Utilisateurs
          </a>
          <a routerLink="/dashboard/fiche-client" routerLinkActive="active" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            Fiche Client
          </a>
        </nav>
      </div>
    </aside>

    <!-- Content Area -->
    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
